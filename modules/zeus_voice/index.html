<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: #0a0e1a; color: #00e5ff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        #eye-container { width: 150px; height: 150px; position: relative; margin-bottom: 20px; }
        .eye { width: 100%; height: 100%; background: radial-gradient(circle, #0d1b2a 40%, #00e5ff 100%); border-radius: 50%; box-shadow: 0 0 30px #00e5ff; transition: all 0.1s ease; }
        .pupil { width: 30px; height: 30px; background: #001a22; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); transition: all 0.3s ease; }
        .eye.blink { height: 5px; border-radius: 5px; }
        #status-text { font-size: 16px; margin-top: 10px; text-shadow: 0 0 10px #00e5ff; }
        #mic-btn { background: none; border: 2px solid #00e5ff; color: #00e5ff; padding: 8px 16px; border-radius: 20px; cursor: pointer; margin-top: 15px; font-size: 14px; }
        #mic-btn:hover { background: #00e5ff; color: #0a0e1a; }
    </style>
</head>
<body>
    <div id="eye-container">
        <div class="eye" id="eye">
            <div class="pupil" id="pupil"></div>
        </div>
    </div>
    <div id="status-text">Aguardando...</div>
    <button id="mic-btn">🎤 Falar</button>

    <script>
        // Função do Streamlit para conversar com o Python
        function sendMessageToPython(message) {
            window.parent.postMessage({
                isStreamlitMessage: true,
                type: "streamlit:setComponentValue",
                value: { text: message }
            }, "*");
        }

        const eye = document.getElementById('eye');
        const pupil = document.getElementById('pupil');
        const statusText = document.getElementById('status-text');
        const micBtn = document.getElementById('mic-btn');

        // Olho piscando
        setInterval(() => {
            eye.classList.add('blink');
            setTimeout(() => eye.classList.remove('blink'), 150);
        }, 4000);

        // Olho olhando para os lados
        setInterval(() => {
            const x = (Math.random() - 0.5) * 40;
            const y = (Math.random() - 0.5) * 40;
            pupil.style.transform = translate(calc(-50% + ${x}px), calc(-50% + ${y}px));
        }, 2000);

        // Lógica da Voz
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = false;
            recognition.interimResults = false;

            micBtn.addEventListener('click', () => {
                recognition.start();
                statusText.innerText = "Ouvindo...";
                eye.style.boxShadow = "0 0 50px #00ff00"; 
            });

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                statusText.innerText = Você disse: ${transcript};
                eye.style.boxShadow = "0 0 30px #00e5ff"; 
                // Envia o texto para o Python!
                sendMessageToPython(transcript);
            };

            recognition.onerror = (event) => {
                statusText.innerText = "Erro: " + event.error;
                eye.style.boxShadow = "0 0 30px #ff0000";
            };
            
            recognition.onend = () => {
                 eye.style.boxShadow = "0 0 30px #00e5ff";
            };
        } else {
            statusText.innerText = "Navegador não suporta voz.";
            micBtn.disabled = true;
        }
    </script>
</body>
</html>
