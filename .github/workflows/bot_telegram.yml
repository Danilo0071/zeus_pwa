import json
import os
import requests

STATE_FILE = "tg_state.json"


def _carregar_ultimo_id() -> int:
    try:
        if os.path.exists(STATE_FILE):
            with open(STATE_FILE, "r", encoding="utf-8") as f:
                data = json.load(f)
                return int(data.get("last_update_id", 0))
    except Exception:
        pass
    return 0


def _salvar_ultimo_id(update_id: int) -> None:
    try:
        with open(STATE_FILE, "w", encoding="utf-8") as f:
            json.dump({"last_update_id": int(update_id)}, f)
    except Exception as e:
        print(f"Aviso ao salvar estado: {e}")


def _gerar_resposta(texto: str) -> str:
    groq_key = os.environ.get("GROQ_API_KEY", "").strip()
    if texto == "/start":
        return "Zeus ativo no Telegram. Pode mandar sua mensagem."

    if groq_key:
        try:
            r = requests.post(
                "https://api.groq.com/openai/v1/chat/completions",
                headers={
                    "Authorization": f"Bearer {groq_key}",
                    "Content-Type": "application/json",
                },
                json={
                    "model": "llama-3.3-70b-versatile",
                    "messages": [
                        {
                            "role": "system",
                            "content": "Você é o Zeus. Responda de forma direta, objetiva e em português.",
                        },
                        {"role": "user", "content": texto},
                    ],
                    "max_tokens": 600,
                },
                timeout=30,
            )
            if r.status_code == 200:
                conteudo = (
                    r.json()
                    .get("choices", [{}])[0]
                    .get("message", {})
                    .get("content", "")
                    .strip()
                )
                if conteudo:
                    return conteudo
        except Exception as e:
            print(f"Erro Groq: {e}")

    return f"Recebido: {texto}"


def _enviar_mensagem(token: str, chat_id: str, texto: str) -> bool:
    try:
        r = requests.post(
            f"https://api.telegram.org/bot{token}/sendMessage",
            json={"chat_id": chat_id, "text": texto[:4000]},
            timeout=30,
        )
        ok = r.status_code == 200 and bool(r.json().get("ok"))
        print(f"Envio para {chat_id}: {'OK' if ok else r.text[:200]}")
        return ok
    except Exception as e:
        print(f"Erro ao enviar mensagem: {e}")
        return False


def main() -> None:
    token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
    chat_id_autorizado = os.environ.get("TELEGRAM_CHAT_ID", "").strip()

    if not token:
        print("ERRO: TELEGRAM_BOT_TOKEN não configurado no ambiente.")
        return

    try:
        requests.get(f"https://api.telegram.org/bot{token}/deleteWebhook", timeout=10)
    except Exception:
        pass

    ultimo_id = _carregar_ultimo_id()
    params = {"timeout": 5}
    if ultimo_id > 0:
        params["offset"] = ultimo_id + 1

    try:
        resp = requests.get(
            f"https://api.telegram.org/bot{token}/getUpdates",
            params=params,
            timeout=20,
        )
        dados = resp.json()
    except Exception as e:
        print(f"ERRO ao buscar updates no Telegram: {e}")
        return

    if not dados.get("ok"):
        print(f"ERRO API Telegram: {dados}")
        return

    updates = dados.get("result", [])
    print(f"Updates encontrados: {len(updates)}")

    for upd in updates:
        uid = int(upd.get("update_id", 0))
        if uid > ultimo_id:
            ultimo_id = uid
            _salvar_ultimo_id(ultimo_id)

        msg = upd.get("message") or upd.get("edited_message") or {}
        texto = (msg.get("text") or "").strip()
        cid = str((msg.get("chat") or {}).get("id") or "").strip()

        if not texto or not cid:
            continue

        if chat_id_autorizado and cid != chat_id_autorizado:
            print(f"Ignorado chat_id {cid} (esperado {chat_id_autorizado})")
            continue

        resposta = _gerar_resposta(texto)
        _enviar_mensagem(token, cid, resposta)


if _name_ == "_main_":
    main()
